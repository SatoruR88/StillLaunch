[package]
name = "stilllaunch"
version = "0.2.0"
edition = "2024"
description = "Windows launcher that starts groups of apps, folders, files, URLs and commands per profile"
license = "MIT"

# The executable keeps its old name so existing shortcuts and the autostart
# entry keep working.
[[bin]]
name = "ProjectLauncher"
path = "src/main.rs"

# Only dependency. JSON is read/written by src/json.rs (no serde).
[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Size-optimised. panic = "abort" is intentionally NOT set: with unwind a
# panicking profile worker only ends its own thread and the resident (or
# the editor) keeps running; abort would take the whole process down.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
